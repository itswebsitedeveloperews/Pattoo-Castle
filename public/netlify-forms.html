<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="company" />
      <input type="text" name="title" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="text" name="address" />
      <input type="text" name="addressLine2" />
      <input type="text" name="city" />
      <select name="state"></select>
      <input type="text" name="postalCode" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="comments"></textarea>
    </form>

    <form name="stay-inquiry" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="stay-inquiry" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="date" name="checkIn" />
      <input type="date" name="checkOut" />
      <textarea name="details"></textarea>
    </form>

    <form
      name="event-inquiry"
      method="POST"
      data-netlify="true"
      enctype="multipart/form-data"
      hidden
    >
      <input type="hidden" name="form-name" value="event-inquiry" />
      <select name="eventType"></select>
      <input type="number" name="attendees" />
      <input type="number" name="guestRooms" />
      <input type="date" name="decisionDate" />
      <input type="date" name="arrivalDate" />
      <input type="date" name="departureDate" />
      <input type="radio" name="datesFlexible" value="yes" />
      <input type="radio" name="datesFlexible" value="no" />
      <select name="contactRole"></select>
      <select name="title"></select>
      <input type="text" name="firstName" />
      <input type="text" name="contactEventType" />
      <input type="text" name="address" />
      <input type="text" name="addressLine2" />
      <input type="text" name="city" />
      <select name="state"></select>
      <input type="text" name="postalCode" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="file" name="proposal" />
    </form>
  </body>
</html>
