[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # reCAPTCHA site keys are public and intentionally included in browser code.
  # Keep both secret-key variables covered by Netlify's secret scanner.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_RECAPTCHA_SITE_KEY,SITE_RECAPTCHA_KEY"
  CONTENTFUL_SPACE_ID = "t14u7man7wab"
  CONTENTFUL_ENVIRONMENT = "master"
  CONTENTFUL_HOME_PAGE_CONTENT_TYPE = "homePage"
  CONTENTFUL_FOOTER_CONTENT_TYPE = "footer"
  CONTENTFUL_HEADER_CONTENT_TYPE = "header"
  CONTENTFUL_ABOUT_CONTENT_TYPE = "about"
  CONTENTFUL_OVERVIEW_CONTENT_TYPE = "overview"
  CONTENTFUL_ACCOMMODATION_CONTENT_TYPE = "accommodation"
  CONTENTFUL_GALLERY_CONTENT_TYPE = "gallery"
  CONTENTFUL_LOCATION_CONTENT_TYPE = "location"
  CONTENTFUL_EVENT_CONTENT_TYPE = "event"
  CONTENTFUL_STAY_CONTENT_TYPE = "stay"

# Set CONTENTFUL_ACCESS_TOKEN in Netlify:
# Site settings > Environment variables > Add variable
# Do not commit the token here.

# Custom reCAPTCHA v2 for all public inquiry forms (set in Netlify UI):
# NEXT_PUBLIC_RECAPTCHA_SITE_KEY: public site key, Builds scope.
# SITE_RECAPTCHA_KEY: same site key, Builds and Runtime scopes.
# SITE_RECAPTCHA_SECRET: matching secret key, Runtime scope.
# Netlify Forms performs server-side verification using SITE_RECAPTCHA_SECRET.
# Redeploy after setting these values. Never commit secret values here.

[[plugins]]
  package = "@netlify/plugin-nextjs"
